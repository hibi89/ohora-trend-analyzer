name: Taxonomy v1.1 offline contract checks

on:
  push:
    branches: [main]
    paths:
      - 'taxonomy/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-test.txt'
      - '.github/workflows/taxonomy-check.yml'
  pull_request:
    paths:
      - 'taxonomy/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/taxonomy-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taxonomy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Check original 159-tag taxonomy and 84 P0 rules
        run: python scripts/validate_taxonomy.py
      - name: Check strict seven-facet model JSON contract
        run: python -m scripts.validate_model_output --input fixtures/sample_p0_model_output.json
      - name: End-to-end offline seven-to-fourteen smoke check
        run: python -m scripts.smoke_p0_pipeline
      - name: Unit-test JSON output validator (synthetic only)
        run: python -m unittest discover -s tests -v
